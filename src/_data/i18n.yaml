  intro:
    heading: 簡介
    about: |
      <p>由中央研究院法律學研究所主辦、國科會臺灣人工智慧卓越中心合辦之第十屆「科技發展與法律規範學術研討會」日前盛大舉行。本屆以「形構數位自我：資料、資本與正義」為核心主題，邀集法學、社會學、公共衛生及人類學等領域學者齊聚，深入探討生成式人工智慧與資訊技術如何重塑人類自我認知、社會權力結構及法治體系。</p>
      <p>中研院法律所兼任研究員暨前所長林子儀於開幕致詞表示，數位資料已深植日常生活，衍生「誰在控制資料、誰從中獲利」等核心提問，敦促法學界全面審視既有法制如何因應科技擴張帶來的權力失衡。大會特別邀請澳洲雪梨新南威爾斯大學SHARP講座教授暨澳洲社會科學院（Academy of the Social Sciences in Australia）與澳洲健康與醫學科學院（Australian Academy of Health and Medical Sciences）院士黛博拉．露普頓（Deborah Lupton）教授發表「生成式 AI 的社會學批判」專題演講，直指科技巨頭承諾背後的資本剝削本質，包括壓榨全球南方資料標註勞工，以及超大規模資料中心對能源、水資源與碳排放造成的嚴峻生態代價。</p>
      <p>研討會亦發表多項跨學科前瞻研究成果：法律所研究員邱文聰剖析基礎模型作為現代「真理體制」與通用基礎設施的地緣政治競奪，示警繁體中文民主語料庫遭邊緣化的危機；社會所黃韋菁專案經理與吳齊殷教授提出「集體資料偏誤」（CDB）本體，揭示人機網絡迴圈中的結構性偏見；法律所副研究員吳全峰借鏡羅爾斯正義論，釐清資料多重資源屬性引發的分配衝突；美國理海大學助理教授李宣緯團隊以數理模型展示偏誤 AI 疫苗資訊如何加劇健康不平等；法律所副研究員陳舜伶分析網路爬蟲規範對開放網路的衝擊與對獨立研究與公共監督的影響；陽明交大彭松嶽與臺科大李姿儀則針對 AI 語音複製倡議跳脫個人同意框架的「關係性治理」。此外，會中亦就數位廣告競爭法與環境智慧規範等議題熱烈交鋒。</p>
      <p>中研院法律所期盼透過跨領域深度思辨，打破技術決定論的盲點，引領各界在資料資本主義浪潮下重新錨定倫理底線，為守護數位時代的人權與民主法治構築兼具正義與前瞻性的制度基石。</p>
    history: |
      <p>The ASCLS is hosted by Institutum Iurisprudentiae, Academia Sinica of Taiwan (IIAS). It is an academic forum for the exchange of ideas and thoughts about important issues regarding the development of technoscience and its implications to law.</p>
      <p>In the past, the ASCLS has focused on topics such as <em>Datafied Governance</em> (2024), <em>Emerging Legal Issues for Artificial Intelligence: Legal Liability, Discrimination, Intellectual Property Rights and Beyond</em> (2018), <em>Disciplining or Empowering the Citizenry Through Citizen Science—Historical and Normative Perspectives on Knowledge and Power</em> (2016), <em>Shaping the Future of Global Health Law</em> (2014), <em>Biotechnology, Health Inequality, and Distributive Justice</em> (2012), or <em>Science Governance, Freedom of Research and Pluralist Democracy</em> (2008).</p>
    design: |
      <p>本次研討會海報以流行藝術為創作靈感，透過重複拼貼台灣家喻戶曉的甜湯罐頭圖案象徵資本市場下的大規模資料重製；在展現台灣日常生活的飲食文化之餘，也藉由喚起電腦揀土豆、八寶配料的記憶符碼，呼應科技寡頭於演算法自動化決策與資料資本的軍備競賽。</p>
      <p>罐頭圖案標示「寡頭牌資料」，「利他蒐集、無添加物」，並且「AI加量不加價！」，並汲取各家AI公司logo之形狀特徵，繪製成花瓣與花蕊。全圖經手工繪製並著色後，以生成式模型將完稿之向量圖轉換成水彩風格、並後製完稿。</p>
  logos: { iias: 中央研究院法律學研究所, infolaw: 中央研究院法律學研究所資訊法中心, aicoe: 臺灣 AI 卓越中心 }
