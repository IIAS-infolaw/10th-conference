  intro:
    heading: Introduction
    about: |
      <p>The 10th Academia Sinica Conference on Law and Science (ASCLS), co-organized by the Institutum Iurisprudentiae, Academia Sinica (IIAS), and the Taiwan AI Center of Excellence (AICoE), recently concluded successfully. Under the theme <em>“Contours the Digital Self: Data, Capital, and Justice,”</em> the conference brought together scholars from the fields of law, sociology, public health, and anthropology to examine how generative AI and information technologies are reshaping human self-perception, social power structures, and legal systems.</p>
      <p>In his opening remarks, Dr. Tzu-Yi Lin, Adjunct Research Fellow and former Director of IIAS, highlighted the extent to which digital data has become embedded in everyday life. Raising fundamental questions such as ”Who controls data?” and “Who benefits from it?”, he called on the legal community to critically reassess existing regulatory frameworks in response to the power imbalances arising from rapid technological development.</p>
      <p>The conference featured a keynote address titled “Sociological Critiques of Generative AI,” delivered by Professor Deborah Lupton, SHARP Professor in the Faculty of Arts, Design & Architecture at UNSW Sydney and a Fellow of both the Academy of the Social Sciences in Australia (ASSA) and the Australian Academy of Health and Medical Sciences (AAHMS). Professor Lupton examined the exploitative dynamics of capital underlying the promises made by technology giants. She drew attention to the marginalization of data-labeling workers in the Global South, as well as the substantial environmental costs of hyperscale data centers, including their energy and water consumption and carbon emissions.</p>
      <p>The conference also showcased cutting-edge interdisciplinary research. Research Fellow Wen-Tsong Chiou analyzed foundation models as modern “regimes of truth” and general-purpose infrastructure, warning that Traditional Chinese democratic corpora risk being marginalized amid geopolitical competition. Project Manager Andrea Wei-Ching Huang and Professor Chyi-In Wu from the Institute of Sociology introduced the “Collective Data Bias” (CDB) ontology, illustrating how human-machine feedback loops perpetuate structural biases. Drawing on John Rawls’s Theory of Justice, Associate Research Fellow Chuan-Feng Wu examined distributive conflicts arising from the multiple resources associated with data. From a public health perspective, Assistant Professor Wayne Hsuan-Wei Lee and his team at Lehigh University used mathematical models to demonstrate how biased AI-generated vaccine information can exacerbate health inequalities. Turning to the governance of the open web, Associate Research Fellow Shun-Ling Chen examined how regulations governing web scraping affect the open web, highlighting the implications for independent research and public oversight. Finally, Song-Yueh Perng of National Yang Ming Chiao Tung University and Tzu-I Lee of National Taiwan University of Science and Technology advocated moving beyond individual consent frameworks toward a model of “relational governance” for AI voice cloning.The conference also featured lively discussions on topics ranging from competition law and digital advertising to the regulation of ambient intelligence.</p>
      <p>Through interdisciplinary dialogue and critical reflection, IIAS seeks to challenge technological determinism. Amid the rise of data capitalism, the Institute aims to help society re-examine and reaffirm its ethical boundaries, thereby laying a just and forward-looking institutional foundation for the protection of human rights and the promotion of the rule of law in the digital age.</p>
    history: |
      <p>The ASCLS is hosted by Institutum Iurisprudentiae, Academia Sinica of Taiwan (IIAS). It is an academic forum for the exchange of ideas and thoughts about important issues regarding the development of technoscience and its implications to law.</p>
      <p>In the past, the ASCLS has focused on topics such as <em>Datafied Governance</em> (2024), <em>Emerging Legal Issues for Artificial Intelligence: Legal Liability, Discrimination, Intellectual Property Rights and Beyond</em> (2018), <em>Disciplining or Empowering the Citizenry Through Citizen Science—Historical and Normative Perspectives on Knowledge and Power</em> (2016), <em>Shaping the Future of Global Health Law</em> (2014), <em>Biotechnology, Health Inequality, and Distributive Justice</em> (2012), or <em>Science Governance, Freedom of Research and Pluralist Democracy</em> (2008).</p>
    design: |
      <p>Inspired by Pop Art, the conference poster uses a repeating collage of canned sweet soup to symbolize mass data reproduction under capitalism. The design intentionally referenced two iconic Taiwanese brand desserts, the peanut milk soup and the eight-treasure congee, to play with both the cultural nostalgia and the famous yet now-unsettling “computer picks the peanuts for you” ad trope—paralleling tech oligarchies’ arms race in automated decision-making and data capitalism.</p>
      <p>The cans are labeled with <em>Oligarch</em>-branded <em>datum</em>, promised to be <em>altruistically gathered, no additives,</em> and <em>“now with more AI!”</em> The floral elements incorporate the shapes of various AI company logos. The artwork was first drawn and colored digitally as a vector graphic, transformed into watercolor style with a generative model, and finalized through post-processing.</p>
