  intro:
    heading: Introduction
    about: |
      <p>The ASCLS is hosted by Institutum Iurisprudentiae, Academia Sinica of Taiwan (IIAS). It is an academic forum for the exchange of ideas and thoughts about important issues regarding the development of technoscience and its implications to law.</p>
      <p>In the past, the ASCLS has focused on topics such as <em>Datafied Governance</em> (2024), <em>Emerging Legal Issues for Artificial Intelligence: Legal Liability, Discrimination, Intellectual Property Rights and Beyond</em> (2018), <em>Disciplining or Empowering the Citizenry Through Citizen Science—Historical and Normative Perspectives on Knowledge and Power</em> (2016), <em>Shaping the Future of Global Health Law</em> (2014), <em>Biotechnology, Health Inequality, and Distributive Justice</em> (2012), or <em>Science Governance, Freedom of Research and Pluralist Democracy</em> (2008).</p>
    design: |
      <p>Inspired by Pop Art, the conference poster uses a repeating collage of canned sweet soup to symbolize mass data reproduction under capitalism. The design intentionally referenced two iconic Taiwanese brand desserts, the peanut milk soup and the eight-treasure congee, to play with both the cultural nostalgia and the famous yet now-unsettling “computer picks the peanuts for you” ad trope—paralleling tech oligarchies’ arms race in automated decision-making and data capitalism.</p>
      <p>The cans are labeled with <em>Oligarch</em>-branded <em>datum</em>, promised to be <em>altruistically gathered, no additives,</em> and <em>“now with more AI!”</em> The floral elements incorporate the shapes of various AI company logos. The artwork was first drawn and colored digitally as a vector graphic, transformed into watercolor style with a generative model, and finalized through post-processing.</p>
  logos: { iias: "Institutum Iurisprudentiae, Academia Sinica", infolaw: "Information Law Center, IIAS", aicoe: "Taiwan AI Center of Excellence" }
