  descriptionTW: |
    很高興邀請到澳洲新南威爾斯大學的 Deborah Lupton 教授來到臺大公共衛生學院演講！Lupton 教授是國際知名的社會學者，長期研究健康、身體、風險、數位科技與社會不平等，也是批判公共衛生與數位健康研究的重要學者。她的研究提醒我們，健康與疾病從來不只是生物醫學或個人行為的問題，也深深涉及社會文化、政治權力、科技治理，以及人們如何理解與經驗自身的身體。

    本次演講以 The Politics of Public Health in the Pandemic Era 為題，邀請大家一起重新思考疫情時代的公共衛生政治——從風險與責任的界定、科學知識與專業權威，到國家治理、社會不平等與日常生活，公共衛生政策如何形塑我們理解健康、自由與集體責任的方式？

    歡迎對公共衛生、社會學、法律、人權及科技與社會研究有興趣的朋友一起參與！
