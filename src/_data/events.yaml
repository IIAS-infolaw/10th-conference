  credits:
    - role: speaker
      nameTW: Deborah Lupton
      nameEN: Deborah Lupton
      affiliationTW: 澳洲新南威爾斯大學 SHARP 講座教授
      affiliationEN: SHARP Professor, Vitalities Lab, University of New South Wales Sydney
    - role: moderator
