  descriptionTW: |
    本次演講以 The Politics of Public Health in the Pandemic Era 為題，邀請大家一起重新思考疫情時代的公共衛生政治——從風險與責任的界定、科學知識與專業權威，到國家治理、社會不平等與日常生活，公共衛生政策如何形塑我們理解健康、自由與集體責任的方式？
    歡迎對公共衛生、社會學、法律、人權及科技與社會研究有興趣的朋友一起參與！
