  descriptionTW: |
    本次演講將介紹 Deborah Lupton 教授的新書 Living Futures: Shortcuts to a Big Idea（Routledge，2026），探討人們如何透過日常社會與文化實踐想像並準備未來，並結合歷史、社會學、文化地理、藝術設計及人類學等觀點，提出重新想像與實踐未來的方法。
  descriptionEN: |
    This presentation provides an overview of my new book Living Futures: Shortcuts to a Big Idea (Routledge, 2026). The book presents an overview of how people engage in lay futuring: that is, social and cultural practices of imagining and preparing for the future. I will discuss the insights offered by the history, sociology, cultural geography, the arts and design, and anthropology of these practices, spanning eras and cultural contexts. I will end with some provocations and methods for new ways of imagining and practising futures.
  registrationUrl: https://forms.gle/b7mZTnP5XZrbxDmB9
